<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudentHub | Register</title>
        <link rel="Stylesheet" href="Register.css">
    </head>
    <body>

        <header>
            <h1>Student Hub Portal</h1>
            <p><i><b>Your Centralized Academic Portal</b></i></p>
            <hr>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Student_dashboard.html">Dashboard</a></li>
                <li><a href="Directory.html">Directory</a></li>
                <li><a href="Login.php">Sign In</a></li>
                <li><a href="Register.php">Register</a></li>
                <li><a href="Contact.php">Contact Us</a></li>
            </ul>
        </nav>

        <main>
        <section>
                <h2><i>Register New Account</i></h2>
                <p class="login-link">Already have an account? <a href="Login.php">Sign In Here</a></p>
                <form id="registerForm" action="Register.php" method="POST">
                <table border="4" cellspacing="3" cellpadding="5">
                    <tr>
                        <td><label for="studentId">Student ID:</label></td>
                        <td>
                            <input type="text" id="studentId" name="studentId" placeholder="e.g., 25CE077 or 25DCE001" required>
                            <p id="studentIdError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="fullName">Full Name:</label></td>
                        <td>
                            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                            <p id="nameError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="email">Email Address:</label></td>
                        <td>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            <p id="emailError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td>
                            <input type="password" id="password" name="password" placeholder="Enter your password (min 8 chars)" required>
                            <p id="passwordStrength" class="strength-meter"></p>
                            <p id="passwordError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="confirmPassword">Confirm Password:</label></td>
                        <td>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
                            <p id="confirmPasswordError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="mobile">Mobile Number:</label></td>
                        <td>
                            <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                            <p id="mobileError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="gender">Gender:</label></td>
                        <td>
                            <select id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <p id="genderError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="year">Year:</label></td>
                        <td>
                            <select id="year" name="year" required>
                                <option value="">Select Year</option>
                                <option value="First Year">First Year</option>
                                <option value="Second Year">Second Year</option>
                                <option value="Third Year">Third Year</option>
                                <option value="Fourth Year">Fourth Year</option>
                            </select>
                            <p id="yearError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="semester">Semester:</label></td>
                        <td>
                            <select id="semester" name="semester" required>
                                <option value="">Select Semester</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>
                            </select>
                            <p id="semesterError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="course">Course:</label></td>
                        <td>
                            <select id="course" name="course" required>
                                <option value="">Select Course</option>
                                <option value="Computer Engineering">Computer Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Electronics Engineering">Electronics Engineering</option>
                            </select>
                            <p id="courseError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="role">Select Role:</label></td>
                        <td>
                            <select id="role" name="role" required>
                                <option value="">Select Role</option>
                                <option value="Student">Student</option>
                                <option value="Faculty">Faculty</option>
                            </select>
                            <p id="roleError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="checkbox" id="terms" name="terms" value="1" style="width: auto; margin-right: 8px;">
                            <label for="terms" style="display: inline; font-weight: normal;">I accept the terms and conditions</label>
                            <p id="termsError" class="error"></p>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">
                            <button type="submit">Register</button>
                            <p id="successMessage" class="success" role="status" aria-live="polite"></p>
                        </td>
                    </tr>
                </table>
                </form>
            </section>
        </main>
        
        <footer>
            <hr>
            <p>&copy; 2026 Dwij Patel; All Rights Reserved</p>
            <a href="Contact.html">Contact Us</a>
        </footer>
        <script src="Register.js"></script>
    </body>
</html>
