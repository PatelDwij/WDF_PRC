<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudentHub | Login</title>
        <link rel="Stylesheet" href="Login.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Student Hub Portal</h1>
            <p><i><b>Your Centralized Academic Portal</b></i></p>
            <hr>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Student_dashboard.html">Dashboard</a></li>
                <li><a href="Directory.html">Directory</a></li>
                <li><a href="Login.html">Login</a></li>
                <li><a href="Register.html">Register</a></li>
                <li><a href="Contact.html">Contact Us</a></li>
            </ul>
        </nav>

        <main>
            <section class="card">
                <h2><b>Account Login</b></h2>
                <form action="Student_dashboard.html" method="get">
                    <table border="4" cellspacing="1" cellpadding="2">
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td><input type="email" id="email" name="email" placeholder="Enter your email" required></td>
                        </tr>
                        <tr>
                            <td><label for="password">Password:</label></td>
                            <td><input type="password" id="password" name="password" placeholder="Enter your password" required></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><button type="submit">Submit</button></td>
                        </tr>
                    </table>
                </form>
                <p class="register-prompt">Don't Have An Account? <a href="Register.html">Register Here</a></p>
            </section>
        </main>
        <footer>
            <hr>
            <p>&copy; 2026 Dwij Patel; All Rights Reserved</p>
            <a href="Contact.html">Contact Us</a>
        </footer>
    </body>
</html>
